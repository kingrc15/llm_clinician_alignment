[project]
name = "readmission-agent-share"
version = "0.1.0"
description = "HF readmission three-pass LLM review + optional reasoning graph (no EHR tools, no ACC guidelines)."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "httpx>=0.27",
  "matplotlib>=3.8",
  # NumPy 2.x breaks many SciPy / scikit-learn wheels still built against 1.x;
  # keep <2 so graph tests and clustering import cleanly in fresh venvs.
  "numpy>=1.26,<2",
  "openai>=1.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "pydantic>=2.0",
  "tenacity>=8.2",
  "tqdm>=4.66",
  "transformers>=4.41",
]

[project.optional-dependencies]
graph = [
  "networkx>=3.2",
  "pyvis>=0.3.2",
  "scikit-learn>=1.4",
  "sentence-transformers>=3.0",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
